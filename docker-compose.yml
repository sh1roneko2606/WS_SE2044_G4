services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ws-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  dashboard:
    build: ./dashboard
    container_name: ws-dashboard
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_TOPIC: ${MQTT_TOPIC:-weather/data}
      OFFLINE_AFTER: ${OFFLINE_AFTER:-180}
    volumes:
      - dashboard-data:/data
    depends_on:
      - mosquitto

  bot:
    build: ./bot
    container_name: ws-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mosquitto

  # Fake NodeMCU for testing without hardware. Only starts with: --profile sim
  simulator:
    image: python:3.12-slim
    container_name: ws-simulator
    profiles: ["sim"]
    working_dir: /sim
    volumes:
      - ./simulator:/sim:ro
    environment:
      MQTT_HOST: mosquitto
      MQTT_TOPIC: ${MQTT_TOPIC:-weather/data}
      SIM_INTERVAL: ${SIM_INTERVAL:-5}
    command: sh -c "pip install -q --no-cache-dir paho-mqtt && python -u simulate.py"
    depends_on:
      - mosquitto

volumes:
  dashboard-data:
